[project]
name = "prelegal"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "litellm>=1.40.0",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
